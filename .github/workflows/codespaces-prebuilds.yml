name: Codespaces Prebuilds

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Dev Container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            bash .devcontainer/setup.sh
